name: Rename to index.html

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git mv rannouch-website.html index.html
          git config user.name "laithzz21"
          git config user.email "laithzz21@users.noreply.github.com"
          git commit -m "Rename rannouch-website.html to index.html"
          git push















